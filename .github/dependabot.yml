version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "09:00"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    groups:
      nextjs:
        patterns:
          - next
          - react
          - react-dom
      tooling:
        patterns:
          - typescript
          - "@types/*"
          - eslint*
          - tailwindcss
          - postcss
          - autoprefixer
    allow:
      - dependency-type: direct
      - dependency-type: development
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      include: scope
