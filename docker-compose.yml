version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: better_auth_db_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: better_auth_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data_new:/var/lib/postgresql/data

volumes:
  postgres_data_new:
