<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه جامع کارویتا - مدیریت دسترسی‌ها و پایش گزارش‌های سیستمی</title>

  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: 'rgb(var(--c-surface) / <alpha-value>)', raised: 'rgb(var(--c-raised) / <alpha-value>)',
            ink: 'rgb(var(--c-ink) / <alpha-value>)', 'on-ink': 'rgb(var(--c-on-ink) / <alpha-value>)',
            brand: {
              50: '#f0f6ff', 100: '#e0edff', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa',
              500: '#0c46b1', 600: '#093a94', 700: '#072d77', 800: '#05215a', 900: '#03143d',
            },
            // Overrides Tailwind's default cool blue-gray "slate"/"gray" with the warm,
            // low-saturation neutral ramp used across the real Karvita product (design tokens
            // named --kv-surface*/--kv-border*/--kv-text* there). Every existing slate-*/gray-*
            // utility class in this file picks this up automatically — no markup changes needed.
            slate: {
              50: '#f8f7f4', 100: '#f0eee9', 150: '#ece9e2', 200: '#e1ded6', 300: '#cdc9be',
              400: '#93a1b4', 500: '#5b6272', 600: '#454b59', 650: '#3a3f4d', 700: '#2e3341',
              800: '#20242f', 900: '#191d2b', 950: '#12141c',
            },
            gray: {
              50: '#f8f7f4', 100: '#f0eee9', 200: '#e1ded6', 300: '#cdc9be',
              400: '#93a1b4', 500: '#5b6272', 600: '#454b59', 700: '#2e3341', 800: '#20242f', 900: '#191d2b',
            }
          },
          borderRadius: {
            'kv-control': '0.375rem', 'kv-panel': '0.75rem', 'kv-card': '1rem',
            // Real shells (sidebar / main viewport) sit at 12px in the product, not Tailwind's 24px default.
            '3xl': '0.75rem',
          },
          fontFamily: {
            sans: ['Vazirmatn', 'Tahoma', 'sans-serif'],
          },
          boxShadow: {
            'kv-soft': 'var(--kv-shadow-soft)', 'kv-raised': 'var(--kv-shadow-raised)',
            'kv-overlay': 'var(--kv-shadow-overlay)', 'kv-floating': 'var(--kv-shadow-floating)'
          }
        }
      }
    }
  </script>

  
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }

    body {
      font-feature-settings: "liga" 1, "calt" 1;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      background-color: #f4f2ee;
    }

    button:disabled, input:disabled, select:disabled, textarea:disabled {
      opacity: 0.60 !important;
      cursor: not-allowed !important;
      pointer-events: none !important;
      background-color: #f0eee9 !important;
      color: #93a1b4 !important;
      border-color: #cdc9be !important;
    }

    /* Focus-visible ring on every interactive element — keyboard accessibility
       best practice; matches the real product's --kv-ring (same hue as brand). */
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
    [tabindex]:focus-visible, .kv-select:focus-visible {
      outline: 2px solid #0c46b1;
      outline-offset: 2px;
      border-radius: 4px;
    }

    .kv-select-container { position: relative; width: 100%; display: block; }
    .kv-select {
      width: 100%;
      background-color: #ffffff !important;
      border: 1px solid #e1ded6 !important;
      border-radius: 6px !important;
      padding: 8px 12px !important;
      padding-left: 32px !important;
      font-size: 11.5px !important;
      font-weight: 700 !important;
      color: #20242f !important;
      cursor: pointer !important;
      outline: none !important;
      appearance: none !important;
      transition: all 150ms ease-in-out;
    }
    .kv-select:focus {
      border-color: #0c46b1 !important;
      box-shadow: 0 0 0 3px rgba(12, 70, 177, 0.12) !important;
    }
    .kv-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      color: #454b59;
      margin-bottom: 5px;
      text-align: right;
    }

    .kv-table-wrapper {
      width: 100%;
      max-height: 480px !important;
      min-height: 280px !important;
      overflow-x: auto !important;
      overflow-y: auto !important;
      position: relative;
      background-color: #ffffff;
      direction: ltr !important;
      -webkit-overflow-scrolling: touch;
    }
    .kv-table-wrapper table {
      direction: rtl !important;
      width: 100%;
      border-collapse: collapse;
      border-spacing: 0;
    }
    .kv-table-wrapper table thead th {
      position: sticky !important;
      top: 0 !important;
      z-index: 20 !important;
      background-color: #f8f7f4 !important;
      box-shadow: inset 0 -1px 0 #e1ded6 !important;
    }
    .kv-table-wrapper tbody tr {
      border-bottom: 1px solid #f0eee9;
      transition: background-color 100ms ease;
    }
    .kv-table-wrapper tbody tr:hover {
      background-color: #f8f7f4;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 5px !important; height: 5px !important; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f8f7f4 !important; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cdc9be !important; border-radius: 8px !important; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #93a1b4 !important; }

    .no-scrollbar::-webkit-scrollbar { display: none !important; }
    .no-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }

    .kv-select-dropdown { max-height: 220px !important; overflow-y: auto !important; }

    /* ═══ Reports workspace — Karvita tokens (mirrors globals.css --kv-*) ═══ */
    :root {
      
      --c-canvas: 244 242 238;        /* --kv-canvas  #F4F2EE */
      --c-surface: 251 250 248;       /* --kv-surface */
      --c-raised: 255 255 255;
      --c-ink: 28 33 44;              /* --kv-surface-inverse */
      --c-on-ink: 255 255 255;

      --c-slate-50: 247 246 243;  --c-slate-100: 240 238 233; --c-slate-150: 235 232 225;
      --c-slate-200: 226 223 215; --c-slate-300: 206 202 191; --c-slate-400: 146 152 165;
      --c-slate-500: 94 101 115;  --c-slate-600: 72 78 92;    --c-slate-650: 60 65 78;
      --c-slate-700: 47 52 65;    --c-slate-800: 33 37 48;    --c-slate-900: 28 33 44;
      --c-slate-950: 18 21 29;

      --c-brand-50: 240 246 255;  --c-brand-100: 224 236 255; --c-brand-200: 191 218 254;
      --c-brand-300: 147 195 253; --c-brand-400: 88 150 240;  --c-brand-500: 16 75 198;
      --c-brand-600: 11 72 204;   --c-brand-700: 9 57 159;    --c-brand-800: 7 44 124;
      --c-brand-900: 4 26 70;

      --c-emerald-50: 232 248 240; --c-emerald-100: 209 241 225; --c-emerald-200: 160 222 190; --c-emerald-300: 110 200 155; --c-emerald-400: 52 170 120;
      --c-emerald-500: 6 150 104;  --c-emerald-600: 5 150 105;   --c-emerald-700: 6 95 70;    --c-emerald-800: 6 78 59;   --c-emerald-900: 4 50 38;
      --c-rose-50: 253 238 240;    --c-rose-100: 252 223 228;    --c-rose-200: 250 190 200;   --c-rose-300: 244 150 166;  --c-rose-400: 236 96 122;
      --c-rose-500: 225 29 72;     --c-rose-600: 214 30 70;      --c-rose-700: 159 18 57;     --c-rose-800: 136 19 55;    --c-rose-900: 90 12 36;
      --c-amber-50: 253 246 225;   --c-amber-100: 252 238 196;   --c-amber-200: 247 214 140;  --c-amber-300: 240 186 80;  --c-amber-400: 230 150 30;
      --c-amber-500: 217 119 6;    --c-amber-600: 194 98 8;      --c-amber-700: 146 64 14;    --c-amber-800: 120 53 15;   --c-amber-900: 80 35 10;
      --c-sky-50: 238 245 255;     --c-sky-100: 219 234 254;     --c-sky-200: 191 219 254;    --c-sky-300: 147 197 253;   --c-sky-400: 96 165 250;
      --c-sky-500: 59 130 246;     --c-sky-600: 37 99 235;       --c-sky-700: 30 64 175;      --c-sky-800: 30 58 138;     --c-sky-900: 23 37 84;
      --c-violet-50: 248 243 255;  --c-violet-100: 240 230 255;  --c-violet-200: 221 200 252;  --c-violet-300: 196 160 250; --c-violet-400: 167 115 245;
      --c-violet-500: 130 50 220;  --c-violet-600: 118 35 210;   --c-violet-700: 91 33 170;   --c-violet-800: 76 29 140;  --c-violet-900: 50 20 92;
      --c-teal-50: 236 250 247;    --c-teal-100: 204 245 236;    --c-teal-200: 153 230 214;   --c-teal-300: 94 210 188;   --c-teal-400: 45 185 160;
      --c-teal-500: 20 160 140;    --c-teal-600: 13 148 136;     --c-teal-700: 15 110 100;    --c-teal-800: 17 90 82;     --c-teal-900: 12 60 55;
      --c-indigo-50: 240 242 255;  --c-indigo-100: 224 228 255;  --c-indigo-200: 199 205 254;  --c-indigo-300: 165 175 252; --c-indigo-400: 129 140 248;
      --c-indigo-500: 99 102 241;  --c-indigo-600: 79 70 229;    --c-indigo-700: 67 56 202;   --c-indigo-800: 55 48 163;  --c-indigo-900: 35 30 100;

      --kv-shadow-soft: 0 1px 2px hsl(220 18% 20% / 0.05);
      --kv-shadow-raised: 0 0 0 1px hsl(220 16% 18% / 0.06), 0 1px 2px hsl(220 20% 20% / 0.05), 0 2px 6px hsl(220 22% 22% / 0.06);
      --kv-shadow-overlay: 0 0 0 1px hsl(220 16% 18% / 0.07), 0 8px 24px -4px hsl(220 25% 20% / 0.14), 0 2px 8px -2px hsl(220 25% 20% / 0.07);
      --kv-shadow-floating: 0 0 0 1px hsl(220 16% 18% / 0.08), 0 16px 40px -8px hsl(220 25% 18% / 0.18), 0 4px 12px -2px hsl(220 25% 18% / 0.09);
      --kv-ring: 16 75 198;
      --kv-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* ── Motion ── */
    @keyframes kv-fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes kv-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes kv-shimmer { 0% { background-position: -320px 0; } 100% { background-position: 320px 0; } }
    @keyframes kv-toast-in { from { opacity: 0; transform: translateY(-8px) scale(0.98); } to { opacity: 1; transform: none; } }
    .animate-fadeIn { animation: kv-fade-up 360ms var(--kv-ease) both; }
    .kv-stagger > * { animation: kv-fade-up 420ms var(--kv-ease) both; }
    .kv-stagger > *:nth-child(2) { animation-delay: 40ms; } .kv-stagger > *:nth-child(3) { animation-delay: 80ms; }
    .kv-stagger > *:nth-child(4) { animation-delay: 120ms; } .kv-stagger > *:nth-child(5) { animation-delay: 160ms; }
    .kv-skeleton {
      background: linear-gradient(90deg, rgb(var(--c-slate-100)) 0px, rgb(var(--c-slate-50)) 120px, rgb(var(--c-slate-100)) 240px);
      background-size: 640px 100%; animation: kv-shimmer 1.4s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
    }

    /* ── Surfaces ── */
    .kv-card { background: rgb(var(--c-surface)); border: 1px solid rgb(var(--c-slate-200) / 0.9); border-radius: 0.75rem; box-shadow: var(--kv-shadow-raised); }
    .kv-card-flat { background: rgb(var(--c-surface)); border: 1px solid rgb(var(--c-slate-200) / 0.9); border-radius: 0.75rem; }
    .kv-glass { background: rgb(var(--c-surface) / 0.78); backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px); }
    .kv-eyebrow { font-size: 10.5px; font-weight: 800; letter-spacing: 0.02em; color: rgb(var(--c-slate-500)); }
    .kv-num { font-variant-numeric: tabular-nums; }
    .kv-divider { height: 1rem; width: 1px; background: rgb(var(--c-slate-200)); }

    /* ── Controls (kv control radius 6px, 36px height) ── */
    .kv-select-container { position: relative; width: 100%; display: block; }
    .kv-select, .kv-input {
      width: 100%; height: 2.375rem;
      background-color: rgb(var(--c-raised)) !important;
      border: 1px solid rgb(var(--c-slate-200)) !important;
      border-radius: 0.375rem !important;
      padding: 0 0.75rem !important;
      font-size: 12.5px !important; font-weight: 700 !important;
      color: rgb(var(--c-slate-900)) !important;
      outline: none !important; appearance: none !important;
      transition: border-color 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
    }
    .kv-select { padding-left: 2rem !important; cursor: pointer !important; }
    .kv-select:hover, .kv-input:hover { border-color: rgb(var(--c-slate-300)) !important; }
    .kv-select:focus, .kv-input:focus { border-color: rgb(var(--c-brand-500)) !important; box-shadow: 0 0 0 3px rgb(var(--kv-ring) / 0.16) !important; }
    .kv-select option { background: rgb(var(--c-raised)); color: rgb(var(--c-slate-900)); }
    .kv-label { display: block; font-size: 11.5px; font-weight: 800; color: rgb(var(--c-slate-700)); margin-bottom: 6px; text-align: right; }

    /* Filter drawer: normalise every legacy field so all controls share one recipe. */
    .kv-drawer-body input[type="text"], .kv-drawer-body input[type="number"] {
      height: 2.375rem; background-color: rgb(var(--c-raised)) !important; border: 1px solid rgb(var(--c-slate-200)) !important;
      border-radius: 0.375rem !important; font-size: 12.5px !important; font-weight: 700 !important; color: rgb(var(--c-slate-900)) !important;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .kv-drawer-body input[type="text"]:focus, .kv-drawer-body input[type="number"]:focus {
      border-color: rgb(var(--c-brand-500)) !important; box-shadow: 0 0 0 3px rgb(var(--kv-ring) / 0.16) !important; outline: none !important;
    }
    .kv-drawer-body input::placeholder { color: rgb(var(--c-slate-400)); font-weight: 600; }
    .kv-drawer-body hr { border-color: rgb(var(--c-slate-200) / 0.7); }
    .kv-drawer-body > div:not([x-cloak]):not([style*="display: none"]) { animation: kv-fade 220ms ease both; }

    /* Segmented control */
    .kv-seg { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 0.5rem; background: rgb(var(--c-slate-100)); border: 1px solid rgb(var(--c-slate-200) / 0.7); }
    .kv-seg > button { height: 2rem; padding: 0 0.75rem; border-radius: 0.375rem; font-size: 12px; font-weight: 800; color: rgb(var(--c-slate-500)); display: inline-flex; align-items: center; gap: 6px; transition: all 180ms var(--kv-ease); }
    .kv-seg > button:hover { color: rgb(var(--c-slate-800)); }
    .kv-seg > button[aria-selected="true"] { background: rgb(var(--c-raised)); color: rgb(var(--c-brand-700)); box-shadow: var(--kv-shadow-raised); }

    /* Buttons */
    .kv-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; height: 2.375rem; padding: 0 0.875rem; border-radius: 0.375rem; font-size: 12.5px; font-weight: 800; white-space: nowrap; transition: background-color 150ms ease, color 150ms ease, box-shadow 150ms ease, transform 120ms ease; }
    .kv-btn:active { transform: scale(0.97); }
    .kv-btn-primary { background: rgb(var(--c-brand-500)); color: #fff; box-shadow: 0 1px 2px rgb(var(--c-brand-900) / 0.25), inset 0 1px 0 rgb(255 255 255 / 0.12); }
    .kv-btn-primary:hover { background: rgb(var(--c-brand-600)); }
    .kv-btn-ghost { color: rgb(var(--c-slate-600)); }
    .kv-btn-ghost:hover { background: rgb(var(--c-slate-100)); color: rgb(var(--c-slate-900)); }
    .kv-btn-outline { background: rgb(var(--c-raised)); color: rgb(var(--c-slate-700)); border: 1px solid rgb(var(--c-slate-200)); }
    .kv-btn-outline:hover { border-color: rgb(var(--c-slate-300)); color: rgb(var(--c-slate-900)); background: rgb(var(--c-slate-50)); }
    .kv-btn-danger-soft { color: rgb(var(--c-rose-700)); background: rgb(var(--c-rose-50)); }
    .kv-btn-danger-soft:hover { background: rgb(var(--c-rose-100)); }
    .kv-icon-btn { width: 2.375rem; padding: 0; }

    /* ── Report table ── */
    .kv-table-wrapper { width: 100%; overflow: auto; position: relative; -webkit-overflow-scrolling: touch; }
    .kv-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .kv-table thead th {
      position: sticky; top: 0; z-index: 5;
      background: rgb(var(--c-slate-50)); color: rgb(var(--c-slate-500));
      font-size: 11.5px; font-weight: 800; white-space: nowrap;
      padding: 0 1rem; height: 2.75rem;
      border-bottom: 1px solid rgb(var(--c-slate-200));
    }
    .kv-table thead th:first-child { position: sticky; right: 0; z-index: 6; }
    .kv-table tbody td {
      padding: 0.75rem 1rem; font-size: 12.5px; font-weight: 600; color: rgb(var(--c-slate-700));
      border-bottom: 1px solid rgb(var(--c-slate-150)); white-space: nowrap; vertical-align: middle;
      font-variant-numeric: tabular-nums; transition: background-color 120ms ease;
    }
    .kv-table tbody td:first-child { position: sticky; right: 0; z-index: 1; background: rgb(var(--c-surface)); box-shadow: -1px 0 0 rgb(var(--c-slate-150)); }
    .kv-table thead th:first-child { box-shadow: -1px 0 0 rgb(var(--c-slate-200)); }
    .kv-table tbody tr:hover td { background: rgb(var(--c-slate-50)); }
    .kv-table tbody tr:last-child td { border-bottom: 0; }
    .kv-table[data-density="compact"] tbody td { padding-top: 0.4rem; padding-bottom: 0.4rem; font-size: 12px; }
    .kv-table[data-density="compact"] thead th { height: 2.25rem; }

        .kv-tablewrap { overflow: auto; position: relative; -webkit-overflow-scrolling: touch; }
    /* ── Report library list ── */
    .kv-lib-item { display: flex; align-items: flex-start; gap: 0.625rem; width: 100%; padding: 0.55rem 0.625rem; border-radius: 0.5rem; text-align: right; font-size: 12.5px; font-weight: 700; line-height: 1.55; color: rgb(var(--c-slate-700)); transition: background-color 150ms ease, color 150ms ease; }
    .kv-lib-item:hover { background: rgb(var(--c-slate-100)); color: rgb(var(--c-slate-900)); }
    .kv-lib-item[aria-current="true"] { background: rgb(var(--c-brand-50)); color: rgb(var(--c-brand-700)); font-weight: 800; box-shadow: inset 0 0 0 1px rgb(var(--c-brand-200) / 0.8); }
    .kv-lib-item .kv-lib-icon { width: 1.75rem; height: 1.75rem; border-radius: 0.375rem; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; background: rgb(var(--c-slate-100)); color: rgb(var(--c-slate-500)); transition: all 150ms ease; }
    .kv-lib-item[aria-current="true"] .kv-lib-icon { background: rgb(var(--c-brand-500)); color: #fff; }


    #pdf-printable-template, #pdf-printable-template * {
      letter-spacing: normal !important;
      word-spacing: normal !important;
      font-feature-settings: "liga" 1, "calt" 1 !important;
    }
  
    /* Mirror better-auth DashboardChrome spacing/surfaces */
    body.kv-app { min-height: 100dvh; background: #f4f2ee; }
    .kv-header {
      height: 4rem; position: sticky; top: 0; z-index: 30;
      background: rgb(244 242 238 / 0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgb(225 222 214 / 0.9);
    }
    .kv-frame {
      width: 100%; max-width: 1600px; margin-inline: auto;
      padding: 0.75rem 1rem 1.25rem;
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    @media (min-width: 1024px) {
      .kv-frame { flex-direction: row; align-items: flex-start; padding: 1rem 1.5rem 1.5rem; gap: 1rem; }
    }
    .kv-sidebar-card {
      width: 100%; background: #fbfaf8; border: 1px solid rgb(225 222 214 / 0.9);
      border-radius: 0.75rem; box-shadow: 0 1px 2px rgb(25 29 43 / 0.04);
      overflow: hidden;
    }
    @media (min-width: 1024px) {
      .kv-sidebar-card {
        position: sticky; top: calc(4rem + 1rem);
        width: 22rem; flex-shrink: 0; max-height: calc(100dvh - 5.5rem);
        display: flex; flex-direction: column;
      }
    }
    .kv-nav-item {
      width: 100%; display: flex; align-items: flex-start; gap: 0.55rem;
      padding: 0.55rem 0.7rem; border-radius: 0.65rem;
      font-size: 11.5px; font-weight: 800; color: #454b59; text-align: right;
      border: 1px solid transparent; transition: 0.15s ease; line-height: 1.45;
    }
    .kv-nav-item:hover { background: #f0eee9; color: #191d2b; }
    .kv-nav-item[aria-current="page"] {
      background: #e8eef9; color: #093a94; border-color: rgb(12 70 177 / 0.14);
    }
    .kv-nav-item i { width: 1rem; text-align: center; color: #93a1b4; margin-top: 0.15rem; flex-shrink: 0; }
    .kv-nav-item[aria-current="page"] i { color: #0c46b1; }
    .kv-report-nav span { white-space: normal; }

    .kv-main {
      flex: 1; min-width: 0;
      background: #fbfaf8; border: 1px solid rgb(225 222 214 / 0.85);
      border-radius: 0.75rem; padding: 0.85rem 1rem 1.1rem;
      display: flex; flex-direction: column; gap: 0.75rem;
      min-height: min(70dvh, 720px);
    }
    @media (min-width: 1024px) {
      .kv-main { min-height: calc(100dvh - 5.5rem); padding: 1rem 1.15rem 1.25rem; }
    }

    .kv-page-header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .kv-page-icon {
      width: 2.5rem; height: 2.5rem; border-radius: 0.5rem;
      background: rgb(12 70 177 / 0.1); color: #0c46b1;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .kv-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
      padding: 0.65rem; border: 1px solid #ece9e2; border-radius: 0.65rem; background: #f8f7f4;
    }
    .kv-toolbar .kv-select, .kv-toolbar .kv-input { height: 2.125rem !important; font-size: 12px !important; }
    .kv-seg {
      display: inline-flex; padding: 3px; gap: 2px; border-radius: 0.5rem; background: #ece9e2;
    }
    .kv-seg button {
      height: 1.85rem; padding: 0 0.7rem; border: 0; border-radius: 0.4rem;
      font-size: 11.5px; font-weight: 800; color: #5b6272; background: transparent;
    }
    .kv-seg button[aria-selected="true"] { background: #fff; color: #0c46b1; box-shadow: 0 1px 2px rgb(0 0 0 / 0.06); }
    .kv-panel {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      border: 1px solid #e1ded6; border-radius: 0.65rem; background: #fff; overflow: hidden;
    }
    .kv-panel-bar {
      height: 2.35rem; padding: 0 0.75rem; border-bottom: 1px solid #ece9e2;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11.5px; font-weight: 800; color: #454b59; background: #f8f7f4;
    }
    .kv-chip {
      height: 1.65rem; padding: 0 0.55rem; border-radius: 999px; border: 1px solid #e1ded6;
      background: #fff; font-size: 10.5px; font-weight: 700; color: #454b59;
      display: inline-flex; align-items: center; gap: 0.35rem;
    }
    .kv-fab {
      position: fixed; bottom: 1.15rem; left: 1.15rem; z-index: 80;
      height: 2.75rem; padding: 0 0.9rem; border-radius: 0.85rem;
      background: #191d2b; color: #fff; border: 1px solid #2e3341;
      box-shadow: 0 10px 24px rgb(25 29 43 / 0.25);
      display: inline-flex; align-items: center; gap: 0.45rem;
      font-size: 11px; font-weight: 800;
    }
    .kv-table-wrapper { max-height: none !important; min-height: 240px !important; flex: 1; }

  </style>
</head>
<body class="kv-app text-slate-800 font-sans"
      x-data="karvitaApp()" x-init="init()" x-cloak>

  <div class="fixed top-4 left-4 z-[300] flex flex-col gap-2 max-w-sm pointer-events-none">
    <template x-for="toast in toasts" :key="toast.id">
      <div class="pointer-events-auto px-3.5 py-3 rounded-xl shadow-xl text-xs font-black flex items-center gap-2 text-white bg-slate-900 border border-slate-800">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span x-text="toast.message"></span>
      </div>
    </template>
  </div>

  <!-- Header = project Header -->
  <header class="kv-header">
    <div class="h-full px-4 sm:px-6 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <button class="lg:hidden w-9 h-9 rounded-xl bg-white border border-slate-200" @click="isSidebarOpen=true"><i class="fa-solid fa-bars"></i></button>
        <div class="w-9 h-9 bg-[#0c46b1] rounded-xl flex items-center justify-center text-white shrink-0">
          <svg class="w-5 h-5" viewBox="0 0 32 32" fill="none"><path d="M9 22L16 9L23 22M12 17H20" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="min-w-0 hidden sm:block">
          <div class="text-sm font-black text-slate-900 leading-tight">کارویتا</div>
          <div class="text-[10px] font-bold text-slate-500">سامانه کارآموزی و کارورزی</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button class="relative w-9 h-9 rounded-xl bg-white border border-slate-200 text-slate-500"><i class="fa-solid fa-bell text-xs"></i><span class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-rose-500"></span></button>
        <button class="flex items-center gap-2 rounded-2xl border border-slate-200 bg-white py-1 pr-3 pl-1" @click="isSimulatorOpen=true" title="تعویض نقش نمونه">
          <div class="text-right hidden md:block">
            <div class="text-xs font-black leading-tight" x-text="currentUser().name"></div>
            <div class="text-[9.5px] font-bold text-slate-500" x-text="currentUser().roleLabel"></div>
          </div>
          <div class="w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center"><i class="fa-solid text-[11px]" :class="currentUser().icon"></i></div>
        </button>
      </div>
    </div>
  </header>

  <div class="kv-frame">
    <!-- mobile sidebar overlay -->
    <div class="lg:hidden fixed inset-0 z-40" x-show="isSidebarOpen" x-cloak>
      <div class="absolute inset-0 bg-slate-950/40" @click="isSidebarOpen=false"></div>
      <aside class="absolute inset-y-0 right-0 w-72 bg-[#fbfaf8] shadow-2xl p-3 overflow-y-auto">
        <div class="flex justify-between items-center mb-3"><span class="text-xs font-black">منوی سامانه</span><button class="w-8 h-8 rounded-lg border" @click="isSidebarOpen=false"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="space-y-1" x-html="''"></div>
        <button class="kv-nav-item" :aria-current="activeTab==='standard_reports'?'page':null" @click="activeTab='standard_reports'; isSidebarOpen=false"><i class="fa-solid fa-chart-pie"></i><span>گزارش‌های سیستمی</span></button>
        <button class="kv-nav-item" x-show="canRbac()" :aria-current="activeTab==='rbac'?'page':null" @click="activeTab='rbac'; isSidebarOpen=false"><i class="fa-solid fa-user-shield"></i><span>مدیریت دسترسی گزارش‌ها</span></button>
        <div class="pt-2 mt-1 border-t border-slate-100" x-show="activeTab==='standard_reports'">
          <div class="px-2 pb-1.5 text-[9.5px] font-black text-slate-400">گزارش‌های این نقش</div>
          <template x-for="rep in availableReports()" :key="'mnav-'+rep.id">
            <button type="button" class="kv-nav-item kv-report-nav" :aria-current="selectedReportId===rep.id?'page':null"
              @click="selectReport(rep.id); isSidebarOpen=false">
              <i class="fa-solid" :class="rep.icon"></i><span x-text="reportLabel(rep)"></span>
            </button>
          </template>
        </div>
      </aside>
    </div>

    <!-- Sidebar card = project Sidebar -->
    <aside class="kv-sidebar-card hidden lg:flex">
      <div class="px-3 pt-3 pb-2 border-b border-slate-100">
        <div class="text-[10px] font-black text-slate-400">منوی سامانه</div>
        <div class="text-[12px] font-black text-slate-800 mt-1" x-text="currentUser().roleLabel"></div>
      </div>
      <nav class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
        <button class="kv-nav-item" type="button" :aria-current="activeTab==='standard_reports' && !selectedReportId ? 'page' : null" @click="activeTab='standard_reports'">
          <i class="fa-solid fa-chart-pie"></i><span>گزارش‌های سیستمی</span>
        </button>
        <button class="kv-nav-item" type="button" x-show="canRbac()" :aria-current="activeTab==='rbac'?'page':null" @click="activeTab='rbac'">
          <i class="fa-solid fa-user-shield"></i><span>مدیریت دسترسی گزارش‌ها</span>
        </button>
        <div class="pt-2 mt-1 border-t border-slate-100" x-show="activeTab==='standard_reports'">
          <div class="px-2 pb-1.5 text-[9.5px] font-black text-slate-400 tracking-wide">گزارش‌های استاندارد این نقش</div>
          <template x-for="rep in availableReports()" :key="'nav-'+rep.id">
            <button type="button" class="kv-nav-item kv-report-nav"
              :aria-current="selectedReportId===rep.id ? 'page' : null"
              @click="selectReport(rep.id)">
              <i class="fa-solid" :class="rep.icon"></i>
              <span x-text="reportLabel(rep)"></span>
            </button>
          </template>
          <p class="px-2 py-2 text-[10px] text-slate-400 font-semibold" x-show="!availableReports().length">برای این نقش گزارشی در سند تعریف نشده.</p>
        </div>
      </nav>
      <div class="p-2 border-t border-slate-100 text-[10px] font-bold text-slate-400">
        <span x-text="toFa(availableReports().length)"></span> گزارش — مطابق سند مهر
      </div>
    </aside>

    <!-- Main viewport -->
    <main class="kv-main">
      <!-- REPORTS MODULE -->
      <template x-if="activeTab==='standard_reports'">
        <div class="contents">
          <div class="kv-page-header">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="kv-page-icon"><i class="fa-solid fa-chart-pie"></i></div>
              <div class="min-w-0">
                <h1 class="text-[14px] font-black text-slate-900 leading-snug" x-text="currentReport() ? reportLabel(currentReport()) : 'گزارش‌های سیستمی'"></h1>
                <p class="text-[11px] font-semibold text-slate-500 mt-0.5 truncate" x-text="(roleNames[currentRole]||'') + ' · استاندارد سند مهر'"></p>
              </div>
            </div>
            <button class="kv-btn kv-btn-outline !h-9 !px-3" @click="refresh(); toast('بروزرسانی شد')"><i class="fa-solid fa-rotate text-[12px]"></i></button>
          </div>

          <template x-if="!availableReports().length">
            <div class="kv-panel items-center justify-center text-center p-10">
              <i class="fa-solid fa-folder-open text-3xl text-slate-300 mb-3"></i>
              <div class="font-black text-sm">برای این نقش گزارشی فعال نیست</div>
              <button class="kv-btn kv-btn-primary mt-4 !h-9" @click="isSimulatorOpen=true">تعویض نقش</button>
            </div>
          </template>

          <template x-if="availableReports().length && currentReport()">
            <div class="contents">
              <!-- toolbar: maps to real KvSelect + buttons -->
              <div class="kv-toolbar">
                <div class="kv-seg">
                  <button type="button" :aria-selected="moduleType==='standard'" @click="moduleType='standard'">استاندارد</button>
                  <button type="button" :aria-selected="moduleType==='comparative'" @click="setComparative()" :disabled="!currentReport().comparable">مقایسه‌ای</button>
                </div>
                <button class="kv-btn kv-btn-outline !h-9 !px-3" @click="openFilters()" :disabled="!filterKeysForCurrent().length" :title="filterKeysForCurrent().length ? 'فیلترهای مجاز این نقش × گزارش' : 'این پنل فیلتر قابل‌تنظیم ندارد'">
                  <i class="fa-solid fa-filter text-brand-600 text-[12px]"></i>
                  <span>فیلتر</span>
                  <span class="text-[10px] font-black text-slate-400" x-text="'(' + toFa(filterKeysForCurrent().length) + ')'"></span>
                  <span class="w-4 h-4 rounded-full bg-brand-500 text-white text-[9px] inline-flex items-center justify-center" x-show="activeFilterCount()" x-text="toFa(activeFilterCount())"></span>
                </button>
                <button class="kv-btn kv-btn-outline !h-9 !px-3" @click="toast('خروجی اکسل نمونه')"><i class="fa-solid fa-file-excel text-emerald-600 text-[12px]"></i><span class="hidden sm:inline">اکسل</span></button>
              </div>

              <div class="flex flex-wrap gap-1.5" x-show="activeFilterCount()">
                <template x-for="c in activeChips()" :key="c.key">
                  <button class="kv-chip" @click="clearFilter(c.key)"><span x-text="c.label"></span><i class="fa-solid fa-xmark text-[9px] text-slate-400"></i></button>
                </template>
                <button class="text-[11px] font-black text-rose-600 px-1" @click="clearAllFilters()">پاک‌سازی</button>
              </div>

              <template x-if="moduleType==='comparative' && currentReport().comparable">
                <div class="grid lg:grid-cols-[1fr_220px] gap-3 flex-1 min-h-0">
                  <div class="kv-panel p-3"><div class="h-[min(360px,50vh)]"><canvas id="cmpChart"></canvas></div></div>
                  <div class="kv-panel">
                    <div class="kv-panel-bar"><span>موجودیت‌ها</span><span class="text-slate-400">۲–۵</span></div>
                    <div class="p-2 space-y-1 overflow-y-auto custom-scrollbar flex-1">
                      <template x-for="e in comparePool" :key="e">
                        <label class="flex items-center justify-between gap-2 rounded-lg px-2.5 py-2 hover:bg-slate-50 cursor-pointer">
                          <span class="text-[12px] font-bold" x-text="e"></span>
                          <input type="checkbox" class="accent-[#0c46b1]" :checked="compareSelected.includes(e)" @change="toggleCompare(e)">
                        </label>
                      </template>
                    </div>
                    <div class="p-2 border-t border-slate-100">
                      <button class="kv-btn kv-btn-primary w-full !h-9" @click="renderChart()">بروزرسانی نمودار</button>
                    </div>
                  </div>
                </div>
              </template>

              <template x-if="moduleType==='standard' || !currentReport().comparable">
                <div class="kv-panel">
                  <div class="kv-panel-bar">
                    <span><span x-text="toFa(tableRows().length)"></span> ردیف</span>
                    <span class="text-slate-400 font-bold" x-text="currentReport().grain"></span>
                  </div>
                  <div class="kv-table-wrapper custom-scrollbar">
                    <table class="kv-table w-full text-[12px]">
                      <thead>
                        <tr>
                          <template x-for="col in visibleColumns()" :key="col.key">
                            <th class="text-right font-black px-3 py-2.5 whitespace-nowrap text-slate-500" x-text="col.label"></th>
                          </template>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="(row, idx) in tableRows()" :key="idx">
                          <tr>
                            <template x-for="col in visibleColumns()" :key="col.key+idx">
                              <td class="px-3 py-2.5 font-semibold text-slate-700 whitespace-nowrap" x-html="row[col.key] ?? '—'"></td>
                            </template>
                          </tr>
                        </template>
                        <tr x-show="!tableRows().length && !loading">
                          <td class="px-4 py-14 text-center text-slate-400 font-bold" :colspan="visibleColumns().length">نتیجه‌ای نیست</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>

      <!-- RBAC MODULE (admin) -->
      <template x-if="activeTab==='rbac'">
        <div class="contents">
          <div class="kv-page-header">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="kv-page-icon"><i class="fa-solid fa-user-shield"></i></div>
              <div class="min-w-0">
                <h1 class="text-[15px] font-black text-slate-900">مدیریت دسترسی گزارش‌ها</h1>
                <p class="text-[11px] font-semibold text-slate-500 mt-0.5">اساین بستهٔ دسته به استان، سپس تیک گزارش هر نقش</p>
              </div>
            </div>
            <div class="flex gap-2">
              <button class="kv-btn kv-btn-outline !h-9 !px-3" @click="applyWordDefaults(); toast('پیش‌فرض سند اعمال شد')">پیش‌فرض سند</button>
              <button class="kv-btn kv-btn-primary !h-9 !px-3" @click="toast('ذخیره شد')">ثبت</button>
            </div>
          </div>

          <div class="grid xl:grid-cols-[180px_1fr_220px] gap-3 flex-1 min-h-0">
            <div class="kv-panel overflow-auto">
              <div class="kv-panel-bar">استان (Scope)</div>
              <div class="p-2">
                <template x-for="p in provinces" :key="p">
                  <button class="w-full text-right px-2.5 py-2 rounded-lg text-[12px] font-bold mb-1"
                          :class="rbacScope===p?'bg-brand-50 text-brand-700':'hover:bg-slate-50 text-slate-600'"
                          @click="rbacScope=p" x-text="p"></button>
                </template>
                <button class="kv-btn kv-btn-outline w-full !h-9 mt-2" @click="copyScopeFrom('تهران')">کپی از تهران</button>
              </div>
            </div>
            <div class="kv-panel overflow-auto">
              <div class="kv-panel-bar">نقش × گزارش</div>
              <div class="p-3">
                <div class="flex flex-wrap gap-1.5 mb-3">
                  <template x-for="role in rbacRoles" :key="role">
                    <button class="px-2 py-1 rounded-lg text-[10.5px] font-black border"
                            :class="rbacRole===role?'bg-slate-900 text-white border-slate-900':'bg-white border-slate-200 text-slate-600'"
                            @click="rbacRole=role" x-text="roleName(role)"></button>
                  </template>
                </div>
                <table class="min-w-full text-[12px]">
                  <thead class="bg-slate-50"><tr>
                    <th class="text-right px-2 py-2 font-black">گزارش</th>
                    <th class="text-right px-2 py-2 font-black">دسته</th>
                    <th class="text-center px-2 py-2 font-black">فعال</th>
                  </tr></thead>
                  <tbody>
                    <template x-for="r in catalog.filter(x => packages[x.category])" :key="'rb'+r.id">
                      <tr class="border-t border-slate-100">
                        <td class="px-2 py-2 font-bold leading-snug" x-text="reportLabel(r)"></td>
                        <td class="px-2 py-2 text-slate-500 font-semibold" x-text="categoryLabel(r.category)"></td>
                        <td class="px-2 py-2 text-center"><input type="checkbox" class="accent-[#0c46b1]" :checked="isAllowed(rbacRole,r.id)" @change="togglePerm(rbacRole,r.id)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="kv-panel overflow-auto">
              <div class="kv-panel-bar">بسته‌های دسته</div>
              <div class="p-2 space-y-1.5">
                <template x-for="c in categories" :key="c.id">
                  <button class="w-full rounded-xl border px-2.5 py-2.5 text-right"
                          :class="packages[c.id]?'border-brand-300 bg-brand-50':'border-slate-200'"
                          @click="togglePackage(c.id)">
                    <div class="flex items-center justify-between gap-2">
                      <div>
                        <div class="text-[12px] font-black" x-text="c.label"></div>
                        <div class="text-[10px] text-slate-500 font-bold mt-0.5" x-text="c.blurb"></div>
                      </div>
                      <span class="text-[9px] font-black px-1.5 py-0.5 rounded-full" :class="packages[c.id]?'bg-brand-500 text-white':'bg-slate-100 text-slate-500'" x-text="packages[c.id]?'ON':'OFF'"></span>
                    </div>
                  </button>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>
    </main>
  </div>

  <!-- Filter drawer: role × report personalized keys -->
  <div class="fixed inset-0 z-[110]" x-show="isFilterDrawerOpen" x-cloak>
    <div class="absolute inset-0 bg-slate-950/35" @click="isFilterDrawerOpen=false"></div>
    <div class="absolute inset-y-0 left-0 w-full max-w-sm bg-[#fbfaf8] shadow-2xl flex flex-col border-r border-slate-200">
      <div class="px-4 py-3 border-b border-slate-200 flex items-start justify-between gap-2">
        <div class="min-w-0">
          <div class="text-[13px] font-black">فیلتر گزارش</div>
          <div class="text-[10px] font-bold text-slate-500 mt-0.5 truncate" x-text="(roleNames[currentRole]||'') + ' · ' + reportLabel(currentReport())"></div>
          <div class="text-[10px] font-semibold text-slate-400 mt-1 leading-relaxed" x-text="scopeHint()"></div>
        </div>
        <button class="w-8 h-8 rounded-lg border shrink-0" @click="isFilterDrawerOpen=false"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3">
        <template x-for="f in visibleFilters()" :key="f.key">
          <label class="block">
            <span class="kv-label" x-text="f.label"></span>
            <template x-if="f.type==='select'">
              <select class="kv-select" x-model="draft[f.key]">
                <option value="">همه</option>
                <template x-for="opt in f.options" :key="opt"><option :value="opt" x-text="opt"></option></template>
              </select>
            </template>
            <template x-if="f.type!=='select'">
              <input class="kv-input" x-model="draft[f.key]" :placeholder="f.label">
            </template>
          </label>
        </template>
        <p class="text-[11px] text-slate-400 font-semibold leading-relaxed" x-show="!visibleFilters().length">
          برای این نقش روی این گزارش فیلتر قابل‌تنظیم نیست؛ محدوده از scope نقش در سرور اعمال می‌شود.
        </p>
      </div>
      <div class="p-3 border-t border-slate-200 flex gap-2">
        <button class="kv-btn kv-btn-outline flex-1 !h-9" @click="resetDraft()" :disabled="!visibleFilters().length">بازنشانی</button>
        <button class="kv-btn kv-btn-primary flex-[1.3] !h-9" @click="applyFilters(); isFilterDrawerOpen=false; toast('فیلتر اعمال شد')" :disabled="!visibleFilters().length">اعمال</button>
      </div>
    </div>
  </div>

  <button class="kv-fab" @click="isSimulatorOpen=true" title="تعویض نقش نمونه">
    <span class="hidden sm:inline">تعویض نقش</span>
    <i class="fa-solid fa-wand-magic-sparkles text-brand-400"></i>
  </button>

  <div x-show="isSimulatorOpen" class="fixed inset-0 z-50" x-cloak>
    <div class="absolute inset-0 bg-slate-950/50" @click="isSimulatorOpen=false"></div>
    <div class="absolute inset-y-0 left-0 w-full max-w-md bg-slate-900 text-slate-100 shadow-2xl flex flex-col border-r border-slate-800">
      <div class="h-12 px-4 border-b border-slate-800 flex items-center justify-between">
        <div class="text-xs font-black flex items-center gap-2"><i class="fa-solid fa-users text-brand-400"></i> سوئیچ نقش (ماک)</div>
        <button @click="isSimulatorOpen=false"><i class="fa-solid fa-xmark text-slate-400"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto p-3 space-y-1.5 custom-scrollbar">

      super_admin: ['termId', 'schoolId', 'mentorId', 'collegeId'],
      assistant_admin: ['termId', 'schoolId', 'mentorId', 'collegeId'],
    },
    principal_feedback_performance: {
      faculty_role: ['termId', 'principalId', 'districtId'],
      super_admin: ['termId', 'principalId', 'districtId', 'collegeId'],
      assistant_admin: ['termId', 'principalId', 'districtId', 'collegeId'],
    },
    supervisor_feedback_performance: {
      faculty_role: ['termId', 'supervisorId'],
      super_admin: ['termId', 'supervisorId', 'collegeId'],
      assistant_admin: ['termId', 'supervisorId', 'collegeId'],
    },
    staff_feedback_performance: {
      regional_edu_admin: ['termId', 'districtId', 'cityId', 'schoolId'],
      edu_general_admin: ['termId', 'districtId', 'cityId', 'schoolId'],
      super_admin: ['termId', 'provinceId', 'districtId', 'cityId', 'schoolId'],
      assistant_admin: ['termId', 'provinceId', 'districtId', 'cityId', 'schoolId'],
    },
    college_feedback_performance: {
      provincial_university: ['termId', 'collegeId'],
      super_admin: ['termId', 'collegeId'],
      assistant_admin: ['termId', 'collegeId'],
    },
    supervisor_school_visits: {
      faculty_role: ['termId', 'supervisorId', 'schoolId'],
      provincial_university: ['termId', 'collegeId', 'supervisorId', 'schoolId'],
      central_organization: ['termId', 'provinceId', 'cityId', 'districtId', 'collegeId', 'supervisorId', 'schoolId'],
      super_admin: ['termId', 'provinceId', 'cityId', 'districtId', 'collegeId', 'supervisorId', 'schoolId'],
      assistant_admin: ['termId', 'provinceId', 'cityId', 'districtId', 'collegeId', 'supervisorId', 'schoolId'],
    },
    province_college_supervisor_perf: {
      central_organization: ['termId', 'provinceId', 'collegeId'],
      super_admin: ['termId', 'provinceId', 'collegeId'],
      assistant_admin: ['termId', 'provinceId', 'collegeId'],
    },
    province_college_mentor_perf: {
      central_organization: ['termId', 'provinceId', 'collegeId'],
      super_admin: ['termId', 'provinceId', 'collegeId'],
      assistant_admin: ['termId', 'provinceId', 'collegeId'],
    },
    province_college_principal_perf: {
      central_organization: ['termId', 'provinceId', 'collegeId'],
      super_admin: ['termId', 'provinceId', 'collegeId'],
      assistant_admin: ['termId', 'provinceId', 'collegeId'],
    },
    capacity_distribution: {
      central_organization: ['termId', 'provinceId', 'collegeId'],
      super_admin: ['termId', 'provinceId', 'collegeId'],
      assistant_admin: ['termId', 'provinceId', 'collegeId'],
    },
    institutions_list: {
      super_admin: ['provinceId', 'collegeId'],
      assistant_admin: ['provinceId', 'collegeId'],
    },
    activity_logs: {
      super_admin: ['dateFrom', 'dateTo'],
      assistant_admin: ['dateFrom', 'dateTo'],
    },
  };

  const roleScopeHint = {
    student: 'فقط داده‌های خودتان — بدون فیلتر مدرسه/نفر دیگر',
    skill_learner: 'فقط داده‌های خودتان — بدون فیلتر مدرسه/نفر دیگر',
    mentor_teacher: 'محدوده: کارورزان تحت راهنمایی شما (مدرسه/معلم ثابت)',
    school_principal: 'محدوده: مدرسه شما (مدرسه در scope سرور ثابت است)',
    supervisor_professor: 'محدوده: کلاس‌ها و کارورزان تحت نظارت شما',
    regional_edu_admin: 'محدوده: منطقه/شهر تابعه — استان در scope است',
    edu_general_admin: 'محدوده: استان‌های تحت اداره کل',
    faculty_role: 'محدوده: دانشکده/پردیس شما',
    provincial_university: 'محدوده: استان دانشگاهی شما',
    central_organization: 'محدوده کلان کشوری — همه فیلترهای مجاز گزارش',
    assistant_admin: 'دسترسی پشتیبانی — همه فیلترهای مجاز گزارش',
    super_admin: 'دسترسی کامل — همه فیلترهای مجاز گزارش',
  };

  return {
    categories, catalog, mockUsers, roleNames,
    currentUserId: '#P1',
    currentRole: 'supervisor_professor',
    activeTab: 'standard_reports',
    isSidebarOpen: false,
    isSimulatorOpen: false,
    isFilterDrawerOpen: false,
    rbacOpen: false,
    librarySearch: '',
    moduleType: 'standard',
    selectedReportId: 'trainee_list',
    loading: false,
    toasts: [],
    chart: null,
    todayLabel: 'سه‌شنبه ۲۷ مهر ۱۴۰۵',
    comparePool: ['البرز', 'فجر', 'بهشتی', 'شرافت', 'کمال'],
    compareSelected: ['البرز', 'فجر', 'بهشتی'],
    provinces: ['تهران', 'اصفهان', 'فارس', 'خراسان رضوی'],
    rbacScope: 'تهران',
    rbacRole: 'faculty_role',
    rbacRoles: ['mentor_teacher', 'supervisor_professor', 'school_principal', 'regional_edu_admin', 'edu_general_admin', 'faculty_role', 'provincial_university', 'central_organization'],
    packages: { C1_trainee: true, C2_grades: true, C3_staff_schools: true, C4_governance: false },
    rolePerms: {},
    scopePerms: {},
    applied: {},
    draft: {},

    init() {
      this.applyWordDefaults(false);
      this.setupForRole();
    },

    toFa(n) {
      return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    },
    roleName(r) { return roleNames[r] || r; },
    categoryLabel(id) { return (categories.find(c => c.id === id) || {}).label || id; },
    currentUser() { return mockUsers.find(u => u.id === this.currentUserId) || mockUsers[0]; },
    currentReport() { return catalog.find(r => r.id === this.selectedReportId); },
    reportLabel(r) {
      if (!r) return '';
      const labels = r.roleLabels || {};
      if (labels[this.currentRole]) return labels[this.currentRole];
      // مدیر ارشد / دستیار: نام کامل سند (ترجیح سازمان مرکزی، وگرنه کامل‌ترین برچسب نقش)
      if (['super_admin', 'assistant_admin'].includes(this.currentRole)) {
        return labels.central_organization
          || labels.faculty_role
          || labels.supervisor_professor
          || labels.edu_general_admin
          || labels.regional_edu_admin
          || labels.school_principal
          || labels.mentor_teacher
          || labels.student
          || Object.values(labels)[0]
          || r.title;
      }
      return r.title;
    },

    availableReports() {
      const ids = this.rolePerms[this.currentRole] || [];
      const byId = Object.fromEntries(catalog.map((r) => [r.id, r]));
      // ترتیب دقیقاً مطابق آرایهٔ نقش در سند مهر (نه ترتیب کاتالوگ)
      return ids
        .map((id) => byId[id])
        .filter(Boolean)
        .filter((r) => r.category !== 'C4_governance' || this.packages.C4_governance || ['super_admin', 'assistant_admin'].includes(this.currentRole));
    },
    libraryGroups() {
      const q = this.librarySearch.trim();
      const reps = this.availableReports().filter((r) => !q || (r.title + this.reportLabel(r)).includes(q));
      // یک گروه واحد «استاندارد» تا لیست مثل سند دیده شود
      if (!q) return [{ id: 'word_standard', label: 'استاندارد (سند مهر)', icon: 'fa-file-lines', reports: reps.filter((r) => r.category !== 'C4_governance') }]
        .concat(reps.some((r) => r.category === 'C4_governance')
          ? [{ id: 'C4_governance', label: 'حاکمیت (افزونه)', icon: 'fa-chart-pie', reports: reps.filter((r) => r.category === 'C4_governance') }]
          : [])
        .filter((g) => g.reports.length);
      return categories
        .map((c) => ({ id: c.id, label: c.label, icon: c.icon, reports: reps.filter((r) => r.category === c.id) }))
        .filter((g) => g.reports.length);
    },

    loginAs(mock) {
      this.currentUserId = mock.id;
      this.currentRole = mock.role;
      this.isSimulatorOpen = false;
      this.moduleType = 'standard';
      const admin = ['super_admin', 'assistant_admin', 'central_organization'].includes(mock.role);
      if (!admin || this.activeTab !== 'rbac') this.activeTab = 'standard_reports';
      this.setupForRole();
      this.toast('نقش فعال: ' + mock.roleLabel);
    },
    setupForRole() {
      const reps = this.availableReports();
      if (!reps.find(r => r.id === this.selectedReportId)) this.selectedReportId = reps[0]?.id || '';
      this.clearAllFilters(false);
      this.refresh();
    },
    selectReport(id) {
      this.selectedReportId = id;
      this.moduleType = 'standard';
      this.clearAllFilters(false);
      this.refresh();
    },
    onReportChange() { this.selectReport(this.selectedReportId); },
    setComparative() {
      const r = this.currentReport();
      if (!r?.comparable) { this.toast('این گزارش مقایسه‌ای ندارد'); return; }
      this.moduleType = 'comparative';
      this.$nextTick(() => this.renderChart());
    },

    /** کلیدهای فیلتر مجاز برای نقش × گزارش جاری */
    filterKeysForCurrent() {
      const r = this.currentReport();
      if (!r) return [];
      const role = this.currentRole;
      const override = reportRoleFilters[r.id] && reportRoleFilters[r.id][role];
      if (override) return override.slice();
      const allow = roleFilterAllow[role] || [];
      return (r.filters || []).filter((k) => allow.includes(k));
    },
    scopeHint() {
      return roleScopeHint[this.currentRole] || '';
    },
    visibleFilters() {
      return this.filterKeysForCurrent().map((k) => F[k]).filter(Boolean);
    },
    visibleColumns() {
      const r = this.currentReport();
      if (!r) return [];
      const keys = r.roleColumns && r.roleColumns[this.currentRole];
      if (!keys || !keys.length) return r.columns || [];
      const map = Object.fromEntries((r.columns || []).map((c) => [c.key, c]));
      return keys.map((k) => map[k]).filter(Boolean);
    },

    activeFilterCount() {
      const keys = new Set(this.filterKeysForCurrent());
      return Object.entries(this.applied).filter(([k, v]) => keys.has(k) && v !== '' && v != null).length;
    },
    activeChips() {
      const keys = new Set(this.filterKeysForCurrent());
      return Object.entries(this.applied)
        .filter(([k, v]) => keys.has(k) && v !== '' && v != null)
        .map(([k, v]) => ({ key: k, label: `${(F[k] || {}).label || k}: ${v}` }));
    },
    applyFilters() {
      const keys = this.filterKeysForCurrent();
      const next = {};
      keys.forEach((k) => { next[k] = this.draft[k] ?? ''; });
      this.applied = next;
      this.refresh();
    },
    resetDraft() {
      const d = {};
      this.filterKeysForCurrent().forEach((k) => { d[k] = ''; });
      this.draft = d;
    },
    clearFilter(key) { this.applied[key] = ''; this.draft[key] = ''; this.refresh(); },
    clearAllFilters(doRefresh = true) {
      const d = {};
      this.filterKeysForCurrent().forEach((k) => { d[k] = ''; });
      this.applied = { ...d };
      this.draft = { ...d };
      if (doRefresh) this.refresh();
    },
    openFilters() {
      const d = {};
      this.filterKeysForCurrent().forEach((k) => { d[k] = this.applied[k] ?? ''; });
      this.draft = d;
      this.isFilterDrawerOpen = true;
    },

    tableRows() {
      const r = this.currentReport();
      if (!r) return [];
      let rows = r.rows || [];
      const school = this.applied.schoolId;
      const province = this.applied.provinceId;
      const trainee = this.applied.traineeId;
      if (school) rows = rows.filter(row => Object.values(row).some(v => String(v).includes(school)));
      if (province) rows = rows.filter(row => Object.values(row).some(v => String(v).includes(province)));
      if (trainee) rows = rows.filter(row => Object.values(row).some(v => String(v).includes(trainee)));
      return rows;
    },
    refresh() {
      this.loading = true;
      setTimeout(() => { this.loading = false; }, 180);
    },

    toggleCompare(e) {
      if (this.compareSelected.includes(e)) {
        if (this.compareSelected.length <= 2) return;
        this.compareSelected = this.compareSelected.filter(x => x !== e);
      } else {
        if (this.compareSelected.length >= 5) { this.toast('حداکثر ۵ مورد'); return; }
        this.compareSelected.push(e);
      }
      this.renderChart();
    },
    renderChart() {
      const canvas = document.getElementById('cmpChart');
      if (!canvas || !window.Chart) return;
      const labels = this.compareSelected;
      if (this.chart) this.chart.destroy();
      this.chart = new Chart(canvas, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'متریک ۱', data: labels.map((_, i) => 12 + (i * 5) % 11), backgroundColor: 'rgba(12,70,177,.85)', borderRadius: 8 },
            { label: 'متریک ۲', data: labels.map((_, i) => 40 + (i * 9) % 30), backgroundColor: 'rgba(15,23,42,.45)', borderRadius: 8 },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { font: { family: 'Vazirmatn' } } },
            title: { display: true, text: this.reportLabel(this.currentReport()), font: { family: 'Vazirmatn', weight: '700' } },
          },
          scales: {
            x: { ticks: { font: { family: 'Vazirmatn' } }, grid: { display: false } },
            y: { beginAtZero: true, ticks: { font: { family: 'Vazirmatn' } } },
          },
        },
      });
    },

    applyWordDefaults(show = true) {
      this.rolePerms = JSON.parse(JSON.stringify(wordDefaults));
      if (!this.scopePerms[this.rbacScope]) this.scopePerms[this.rbacScope] = JSON.parse(JSON.stringify(wordDefaults));
      if (show) this.toast('پیش‌فرض سند برای نقش‌ها اعمال شد');
    },
    isAllowed(role, id) { return (this.rolePerms[role] || []).includes(id); },
    togglePerm(role, id) {
      const set = new Set(this.rolePerms[role] || []);
      if (set.has(id)) set.delete(id); else set.add(id);
      this.rolePerms[role] = [...set];
      if (role === this.currentRole) this.setupForRole();
    },
    togglePackage(catId) {
      this.packages[catId] = !this.packages[catId];
      if (this.packages[catId]) {
        (wordDefaults[this.rbacRole] || []).forEach(id => {
          const r = catalog.find(x => x.id === id);
          if (r && r.category === catId) {
            const set = new Set(this.rolePerms[this.rbacRole] || []);
            set.add(id);
            this.rolePerms[this.rbacRole] = [...set];
          }
        });
        this.toast(`بسته ${this.categoryLabel(catId)} برای ${this.rbacScope} فعال شد`);
      }
    },
    copyScopeFrom(src) {
      const data = this.scopePerms[src] || wordDefaults;
      this.rolePerms = JSON.parse(JSON.stringify(data));
      this.scopePerms[this.rbacScope] = JSON.parse(JSON.stringify(data));
      this.toast(`دسترسی‌ها از ${src} به ${this.rbacScope} کپی شد`);
    },

    canRbac() {
      return ['super_admin', 'assistant_admin', 'central_organization'].includes(this.currentRole);
    },

    toast(message) {
      const id = Date.now();
      this.toasts.push({ id, message });
      setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 2400);
    },
  };
}

  </script>
